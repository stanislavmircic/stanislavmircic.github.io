<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stanislav Mircic - About</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header id="header">
            <!-- Navigation will be inserted here -->
        </header>
        <main>
            <section class="sc-content content-section">
                <img alt="" style="width:100%;" src="images/dolomites-sc67aa4c5ce24f7-960.jpg" srcset="images/dolomites-sc67aa4c5ce24f7-1280.jpg 1280w,images/dolomites-sc67aa4c5ce24f7-960.jpg 960w,images/dolomites-sc67aa4c5ce24f7-640.jpg 640w,images/dolomites-sc67aa4c5ce24f7-320.jpg 320w">
            </section>
        </main>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('nav.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                    
                    // Highlight current page in navigation
                    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
                    const currentLink = document.querySelector(`nav a[href="${currentPage}"]`);
                    if (currentLink) {
                        currentLink.classList.add('active');
                    }
                })
                .catch(error => {
                    console.error('Error loading navigation:', error);
                });
        });
    </script>
    </body>
</html>
